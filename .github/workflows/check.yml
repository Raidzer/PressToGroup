name: Check and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1
      - name: Check Lua syntax and run tests
        run: |
          for file in *.lua tests/*.lua; do
            luac5.1 -p "$file"
          done
          for suite in tests/*_test.lua; do
            lua5.1 "$suite"
          done
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p package_test.py -v
      - name: Build addon package
        run: python3 tools/package.py --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PressToGroup-beta
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
